<!DOCTYPE html>
<html lang="en" data-page="info">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament info</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 id="t-name">Loading&hellip;</h1>
    <p id="t-meta"></p>
  </header>
  <nav class="site-nav" aria-label="Site navigation">
    <a href="index.html" data-page="info">Info</a>
    <a href="rounds.html" data-page="rounds">Rounds</a>
    <a href="standings.html" data-page="standings">Standings</a>
  </nav>
  <main>
    <div id="info-content"><p class="loading">Loading&hellip;</p></div>
  </main>
  <script>const DATA_BASE = 'https://raw.githubusercontent.com/kate-holdener/new-t/data';</script>
  <script src="site.js"></script>
  <script>
    fetchJson(DATA_BASE + '/tournament.json').then(t => {
      document.title = t.name + ' – Info';
      document.getElementById('t-name').textContent = t.name;
      document.getElementById('t-meta').textContent =
        t.start_date + ' · Swiss · ' + t.number_of_rounds + ' rounds';

      const sections = t.sections;
      const minComplete = Math.min(...sections.map(s => s.rounds_complete));
      const inProgress  = sections.some(s => s.rounds_complete > minComplete);
      let status;
      if (minComplete === 0 && !inProgress) {
        status = 'Not yet started';
      } else if (minComplete >= t.number_of_rounds) {
        status = 'Complete';
      } else {
        const r = minComplete + (inProgress ? 1 : 0);
        status = 'Round ' + r + ' of ' + t.number_of_rounds + (inProgress ? ' in progress' : ' complete');
      }

      const sectionRows = sections.length > 1
        ? sections.map(s =>
            '<span class="info-label">' + esc(s.name) + '</span>' +
            '<span>' + s.player_count + ' players, ' + s.rounds_complete + ' rounds complete</span>'
          ).join('')
        : '';

      document.getElementById('info-content').innerHTML =
        '<div class="info-grid">' +
          '<span class="info-label">Tournament</span><span>' + esc(t.name) + '</span>' +
          '<span class="info-label">Date</span><span>' + esc(t.start_date) + '</span>' +
          '<span class="info-label">Format</span><span>Swiss, ' + t.number_of_rounds + ' rounds</span>' +
          '<span class="info-label">Status</span><span>' + esc(status) + '</span>' +
          sectionRows +
        '</div>' +
        '<div class="info-links">' +
          '<a href="rounds.html" class="info-link">View pairings &rsaquo;</a>' +
          '<a href="standings.html" class="info-link">View standings &rsaquo;</a>' +
        '</div>';
    }).catch(() => {
      document.getElementById('info-content').innerHTML =
        '<p class="error">Could not load tournament data.</p>';
    });
  </script>
</body>
</html>
